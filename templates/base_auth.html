{% load static %}
<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Soporte TI{% endblock %} · Soporte TI</title>
    <script>
        try { var t = localStorage.getItem('tema'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-bs-theme', t); } catch (e) {}
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="{% static 'core/plataforma.css' %}" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">
<main class="w-100" style="max-width: 420px">
    <div class="text-center mb-4">
        <div class="brand fs-2 fw-bold">Soporte TI</div>
        <div class="text-uppercase small fw-semibold" style="letter-spacing: 2.4px; color: var(--tc-gold)">The Costa Rica Collection</div>
    </div>
    {% if messages %}
        {% for m in messages %}<div class="alert alert-{{ m.tags }}">{{ m }}</div>{% endfor %}
    {% endif %}
    <div class="card"><div class="card-body p-4">
        {% block content %}{% endblock %}
    </div></div>
    {% block pie %}{% endblock %}
</main>
</body>
</html>
